<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>mdloader</title>
    <style>
      :root {
        --bg: rgba(22, 22, 26, 0.72);
        --panel: rgba(255, 255, 255, 0.06);
        --panel-hover: rgba(255, 255, 255, 0.1);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f2f2f5;
        --muted: rgba(242, 242, 245, 0.55);
        --accent: #d51007;
        --accent-soft: rgba(213, 16, 7, 0.16);
        --ok: #4ade80;
        --warn: #fbbf24;
        --err: #f87171;
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 360px;
        max-width: 420px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        color: var(--text);
        background: transparent;
      }

      body {
        padding: 14px;
        background: var(--bg);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
      }

      /* Во вкладке размытие не по чему применять — даём плотный фон. */
      body.tab-view {
        background: #16161a;
        max-width: 640px;
        margin: 0 auto;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }

      header h1 {
        flex: 1;
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      header .version {
        font-size: 11px;
        color: var(--muted);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      button {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 9px 12px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
      }

      button:hover:not(:disabled) {
        background: var(--panel-hover);
      }

      button:active:not(:disabled) {
        transform: scale(0.98);
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      button.primary {
        background: var(--accent-soft);
        border-color: rgba(213, 16, 7, 0.45);
        font-weight: 600;
      }

      button.primary:hover:not(:disabled) {
        background: rgba(213, 16, 7, 0.26);
      }

      button.icon {
        padding: 4px 9px;
        font-size: 11px;
        border-radius: 8px;
      }

      /* ------------------------------------------------------- активная */

      .active {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 11px 12px;
        margin-bottom: 12px;
      }

      .active .name {
        font-weight: 600;
        margin-bottom: 3px;
        overflow-wrap: anywhere;
      }

      .active .status {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 9px;
      }

      .bar {
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .bar > div {
        height: 100%;
        width: 0;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--accent), #ff5a4d);
        transition: width 0.35s ease;
      }

      /* --------------------------------------------------------- списки */

      section {
        margin-bottom: 10px;
      }

      section > h2 {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--muted);
      }

      section > h2 .count {
        background: var(--panel);
        border-radius: 20px;
        padding: 1px 7px;
        font-size: 10px;
      }

      section > h2 .spacer {
        flex: 1;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
        max-height: 148px;
        overflow-y: auto;
      }

      li {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        border: 1px solid transparent;
        border-radius: 9px;
        padding: 7px 9px;
      }

      li .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      li .meta {
        font-size: 11px;
        color: var(--muted);
      }

      li.empty {
        justify-content: center;
        color: var(--muted);
        background: transparent;
        border: 1px dashed var(--border);
        font-size: 12px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
      }

      .dot.queued {
        background: var(--warn);
      }

      .dot.completed {
        background: var(--ok);
      }

      .dot.error {
        background: var(--err);
      }

      .tag {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 20px;
        border: 1px solid var(--border);
        color: var(--muted);
        flex: none;
      }

      /* ------------------------------------------------------- подвал */

      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }

      footer label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }

      footer .spacer {
        flex: 1;
      }

      accent-checkbox,
      input[type="checkbox"] {
        accent-color: var(--accent);
      }

      #toast {
        margin-bottom: 10px;
        padding: 8px 11px;
        border-radius: 9px;
        font-size: 12px;
        display: none;
      }

      #toast.show {
        display: block;
      }

      #toast.ok {
        background: rgba(74, 222, 128, 0.14);
        border: 1px solid rgba(74, 222, 128, 0.35);
      }

      #toast.err {
        background: rgba(248, 113, 113, 0.14);
        border: 1px solid rgba(248, 113, 113, 0.35);
      }

      ::-webkit-scrollbar {
        width: 7px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>mdloader</h1>
      <span class="version" id="version"></span>
    </header>

    <div id="toast"></div>

    <div class="actions">
      <button id="download-track" class="primary">⬇️ Трек</button>
      <button id="download-playlist">💿 Альбом</button>
    </div>

    <div class="active" id="active" hidden>
      <div class="name" id="active-name"></div>
      <div class="status" id="active-status"></div>
      <div class="bar"><div id="active-bar"></div></div>
    </div>

    <section>
      <h2>В очереди <span class="count" id="queue-count">0</span><span class="spacer"></span></h2>
      <ul id="queue-list"></ul>
    </section>

    <section>
      <h2>
        История
        <span class="spacer"></span>
        <button class="icon" id="clear-history">Очистить</button>
      </h2>
      <ul id="history-list"></ul>
    </section>

    <footer>
      <label><input type="checkbox" id="use-cookies" /> Использовать cookies</label>
      <span class="spacer"></span>
      <button class="icon" id="open-tab">Во вкладке</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
