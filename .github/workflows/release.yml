name: Sign and release

# Tag a commit (e.g. `git tag v1.2.0 && git push origin v1.2.0`) to get a
# Mozilla-signed .xpi attached to a GitHub release. The `unlisted` channel keeps
# the add-on out of the public AMO catalogue while still producing a signature
# that release Firefox and Zen accept permanently.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund

      - name: Verify AMO credentials are configured
        run: |
          if [ -z "${{ secrets.AMO_JWT_ISSUER }}" ] || [ -z "${{ secrets.AMO_JWT_SECRET }}" ]; then
            echo "::error::Set the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets first."
            exit 1
          fi

      - name: Sign on AMO (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx web-ext sign --source-dir extension --artifacts-dir artifacts --channel unlisted

      - name: Attach signed .xpi to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.xpi --generate-notes || gh release upload "${GITHUB_REF_NAME}" artifacts/*.xpi --clobber
